<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Careers | Brews &amp; Bonds</title>
	<style>
		body {
			margin: 0;
			background-color: #f4f4f2;
			color: white;
			font-family: Georgia, serif;
		}

		.container {
			display: flex;
			flex-direction: column;
			width: 100%;
			max-width: none;
			min-height: 100vh;
		}

		main {
			flex: 1;
			display: flex;
			flex-direction: column;
		}

		header, footer {
			background-color: #87a46b;
			color: white;
			padding: 8px 18px;
		}

		header {
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		header h1 {
			display: flex;
			align-items: center;
			gap: 8px;
			margin: 0;
			font-size: 34px;
		}

		.cup-icon {
			width: 40px;
			height: 40px;
		}

		nav a {
			margin-left: 12px;
			color: white;
			text-decoration: none;
		}

		.nav-toggle, .nav-toggle-label {
			display: none;
		}

		nav a:hover, footer a:hover {
			text-decoration: underline;
		}

		.careers {
			position: relative;
			flex: 1;
			min-height: 700px;
			text-align: center;
			overflow: hidden;
		}

		.careers img {
			display: block;
			width: 100%;
			height: 100%;
			min-height: 700px;
			object-fit: cover;
			object-position: center center;
			transform: scale(1.04);
			transform-origin: center center;
		}

		.careers-text {
			position: absolute;
			top: 35%;
			left: 0;
			width: 100%;
			text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
		}

		.careers h2 {
			margin: 0 0 10px;
			font-size: 64px;
			font-weight: normal;
		}

		.careers p {
			margin: 0;
			font-size: 30px;
		}

		.button {
			display: inline-block;
			margin-top: 24px;
			padding: 10px 18px;
			background-color: #2d4c37;
			color: white;
			font-size: 20px;
			text-decoration: none;
			transition: background-color 0.2s, color 0.2s;
		}

		.button:hover {
			background-color: #b7cba0;
			color: #2d4c37;
		}

		footer {
			display: flex;
			align-items: center;
			justify-content: space-between;
			min-height: 70px;
		}

		footer > div {
			display: flex;
			align-items: center;
			gap: 16px;
		}

		footer a {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			margin-right: 20px;
			color: white;
			font-size: 19px;
		}

		.social-icon {
			width: 34px;
			height: 34px;
		}

		.footer-cup {
			width: 78px;
			height: 78px;
			color: #b7cba0;
		}

		@media (max-width: 650px) {
			.container {
				width: 100%;
				margin-top: 0;
				margin-bottom: 0;
			}

			header {
				flex-wrap: wrap;
				gap: 10px;
			}

			header h1 {
				font-size: 28px;
			}

			nav a {
				margin: 0 10px 0 0;
			}

			.nav-toggle {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
			}

			.nav-toggle-label {
				display: block;
				width: 100%;
				padding: 10px 0;
				border-top: 1px solid rgba(255, 255, 255, 0.45);
				cursor: pointer;
			}

			.nav-toggle-label::after {
				content: "";
				float: right;
				width: 20px;
				height: 14px;
				margin-top: 3px;
				background: linear-gradient(to bottom, white 0 2px, transparent 2px 6px, white 6px 8px, transparent 8px 12px, white 12px 14px);
			}

			.nav-toggle:focus-visible + .nav-toggle-label {
				outline: 2px solid white;
				outline-offset: 3px;
			}

			.nav-toggle:not(:checked) ~ nav {
				display: none;
			}

			header nav {
				width: 100%;
			}

			header nav a {
				display: block;
				padding: 8px 0;
			}

			.careers {
				flex: initial;
				min-height: 0;
				height: auto;
			}

			.careers-text {
				top: 30%;
			}

			.careers h2 {
				font-size: 48px;
			}

			.careers p {
				font-size: 23px;
			}

			footer {
				flex-wrap: wrap;
				gap: 12px;
			}

			footer > div {
				flex-wrap: wrap;
				gap: 10px;
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<header>
			<h1>
				<svg class="cup-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
					<path d="M8 11h28v13a12 12 0 0 1-12 12h-4A12 12 0 0 1 8 24V11Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
					<path d="M36 15h3a5 5 0 0 1 0 10h-4M7 42h34" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
				</svg>
				Brews &amp; Bonds
			</h1>
			<input class="nav-toggle" type="checkbox" id="nav-toggle" aria-label="Toggle main navigation">
			<label class="nav-toggle-label" for="nav-toggle"></label>
			<nav aria-label="Main navigation">
				<a href="index.html">Home</a>
				<a href="about.html">About</a>
                <a href="menu.html">Menu</a>
				<a href="events.html">Events</a>
				<a href="jobs.html">Jobs</a>
			</nav>
		</header>

		<main>
			<section class="careers">
				<img src="coffee lady.png" alt="A cafe worker preparing food behind a counter">
				<!-- Resize the image to fit the container-->
				<div class="careers-text">
					<h2>Careers!</h2>
					<p>Join our team today!</p>
                    <a class="button" href="jobs.html">Let's go!</a>
				</div>
			</section>
		</main>

		<footer>
			<div>
				<a href="https://www.instagram.com/" aria-label="Instagram: @brews and bonds coffee">
					<svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
						<rect x="3" y="3" width="18" height="18" rx="5"/>
						<circle cx="12" cy="12" r="4"/>
						<circle cx="17.5" cy="6.5" r="0.75" fill="currentColor"/>
					</svg>
					@brews&amp;bonds_coffee
				</a>
				<a href="https://www.facebook.com/" aria-label="Facebook: @brews and bonds coffee">
					<svg class="social-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
						<path d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.3V13h2.8v8h3.4Z"/>
					</svg>
					@brews&amp;bonds_coffee
				</a>
			</div>
			<svg class="cup-icon footer-cup" viewBox="0 0 48 48" fill="none" aria-hidden="true">
				<path d="M8 11h28v13a12 12 0 0 1-12 12h-4A12 12 0 0 1 8 24V11Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
				<path d="M36 15h3a5 5 0 0 1 0 10h-4M7 42h34" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
			</svg>
		</footer>
	</div>
</body>
</html>
