<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Assignment 3</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <style>
        body {
            background-color: #6c6c6c;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        /*Header*/
        #site-header {
            width: 100%;
            margin: 30px auto;
            text-align: center;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #site-header .col-100,
        footer .col-100 {
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #6c6c6c;
            width: 100%;
            box-sizing: border-box;
        }

        /*Content*/
        #content {
            width: 1440px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #6c6c6c;
        }

        #content .row {
            display: flex;
            width: 100%;
        }

        #content .col-a,
        #content .col-b,
        #content .col-50,
        #content .col-33 {
            padding: 20px;
            border: 1px solid #6c6c6c;
        }

        #content .col-a {
            flex: 1;
        }

        #content .col-b {
            width: 200px;
        }

        #content .col-50 {
            flex: 1;
        }

        #content .col-33 {
            flex: 1;
        }

        /*Footer*/
        footer {
            width: 1440px;
            margin: 0 auto;
        }
    </style>
  </head>
  <body>
    <header id="site-header">
      <div class="row">
        <div class="col-100">
          header: col-100<br />This entire layout is 1440px wide
        </div>
      </div>
    </header>

    <main>
      <div id="content">
        <div class="row">
          <div class="col-a">col-a</div>
          <div class="col-b">col-b<br />(width 200px)</div>
        </div>

        <div class="row">
          <div class="col-50">col-50</div>
          <div class="col-50">col-50</div>
        </div>

        <div class="row">
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
        </div>
      </div>

      <footer>
        <div class="row">
          <div class="col-100">footer: col-100</div>
        </div>
      </footer>
    </main>
  </body>
</html>
